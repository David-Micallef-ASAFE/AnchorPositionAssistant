<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Anchor Position Assistant</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <a href="#/" class="brand">
      <svg viewBox="-14 -40 28 42" width="18" height="26" aria-hidden="true"><path class="pin-shape ref" d="M0,0 C-2,-9 -12,-15 -12,-26 A12,12 0 1,1 12,-26 C12,-15 2,-9 0,0 Z"/><circle cx="0" cy="-26" r="4.5" fill="#fff"/></svg>
      Anchor Position Assistant
    </a>
    <div id="topbar-context"></div>
  </header>

  <!-- ============ Floor plan list ============ -->
  <main id="view-home" class="view" hidden>
    <section class="card upload-card">
      <h2>Add floor plan</h2>
      <form id="upload-form" autocomplete="off">
        <label>Name
          <input name="name" required placeholder="e.g. Building A – Ground floor" />
        </label>
        <div class="row">
          <label>Width (m)
            <input name="width" type="number" step="any" min="0.01" required />
          </label>
          <label>Height (m)
            <input name="height" type="number" step="any" min="0.01" required />
          </label>
        </div>
        <label>Image (PNG or JPEG)
          <input name="image" type="file" accept="image/png,image/jpeg" required />
        </label>
        <div id="upload-preview" class="upload-preview" hidden>
          <img alt="Preview" />
          <div class="hint" id="upload-hint"></div>
        </div>
        <p class="hint">Coordinates are in meters; (0, 0) is the bottom-left corner of the image.</p>
        <button type="submit" class="primary">Upload floor plan</button>
      </form>
    </section>

    <section class="card list-card">
      <div class="card-head">
        <h2>Floor plans</h2>
        <input id="plan-search" type="search" placeholder="Search by name…" />
      </div>
      <table class="table">
        <thead><tr><th></th><th>Name</th><th>Size (m)</th><th>Anchors</th><th>Created</th><th></th></tr></thead>
        <tbody id="plan-rows"></tbody>
      </table>
      <p id="plan-empty" class="empty" hidden>No floor plans yet.</p>
    </section>
  </main>

  <!-- ============ Floor plan editor ============ -->
  <main id="view-plan" class="view plan-view" hidden>
    <section class="viewer-wrap">
      <div id="viewer" class="viewer">
        <svg id="plan-svg" xmlns="http://www.w3.org/2000/svg">
          <rect id="plan-bg" x="0" y="0" width="100%" height="100%" fill="transparent"/>
          <image id="plan-image" preserveAspectRatio="none"/>
          <rect id="plan-border" fill="none"/>
          <g id="layer-lines"></g>
          <g id="layer-pins"></g>
          <g id="layer-labels"></g>
        </svg>
      </div>
      <div class="viewer-toolbar">
        <button data-zoom="in" title="Zoom in">+</button>
        <button data-zoom="out" title="Zoom out">−</button>
        <button data-zoom="fit" title="Fit to screen">Fit</button>
        <label class="lock"><input type="checkbox" id="lock-pins" /> Lock pins</label>
      </div>
      <div id="cursor-readout" class="cursor-readout"></div>
      <div id="mode-banner" class="mode-banner" hidden></div>
    </section>

    <aside class="sidebar">
      <section class="panel">
        <h3>Anchors
          <button id="export-csv" class="small" style="margin-left:auto" title="Download the anchors ticked for export as CSV">Export CSV</button>
          <button id="export-sql" class="small" title="Download an SQL script that updates the device coordinates of the anchors ticked for export">Export SQL</button>
        </h3>
        <form id="anchor-form" class="anchor-form" autocomplete="off">
          <input name="serial" placeholder="Serial number" required />
          <button type="button" id="scan-serial" title="Scan the anchor's QR code with the webcam">📷 Scan</button>
          <select name="type">
            <option value="reference">Reference</option>
            <option value="approximate">Approximate</option>
          </select>
          <button type="submit" class="primary">Add anchor</button>
        </form>
        <input id="anchor-search" type="search" placeholder="Search serial…" />
        <div class="table-scroll">
          <table class="table compact">
            <thead><tr><th>Serial</th><th>Type</th><th class="num">X</th><th class="num">Y</th>
              <th class="center"><label class="export-head" title="Tick / untick all listed anchors"><input type="checkbox" id="export-all" /> Export</label></th><th></th></tr></thead>
            <tbody id="anchor-rows"></tbody>
          </table>
          <p id="anchor-empty" class="empty" hidden>No anchors yet. Add one above, then drag its pin to where it is installed.</p>
        </div>
      </section>

      <section class="panel" id="selected-panel" hidden></section>
    </aside>
  </main>

  <div id="toast" class="toast" hidden></div>

  <script src="vendor/jsQR.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
